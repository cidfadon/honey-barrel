global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: hermes
    static_configs:
      - targets:
          - hermes:9106
    metrics_path: /metrics

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: hermes-exporter
    static_configs:
      - targets:
          - hermes-exporter:9105

  - job_name: ollama-exporter
    static_configs:
      - targets:
          - ollama-exporter:9110

  - job_name: alpaca-exporter
    static_configs:
      - targets:
          - alpaca-exporter:9111

  - job_name: investment-analyst-api
    static_configs:
      - targets:
          - investment-analyst-api:8001
    metrics_path: /api/metrics
