  #    OPENCLAW_PRIMARY_MODEL: "ollama/${OLLAMA_MODEL:-gemma4-hermes:latest}"
  #    OPENCLAW_GATEWAY_CONTROLUI_DANGEROUSLYDISABLEDEVICEAUTH: "true"
  #    OPENCLAW_DEVICE_ID: "openclaw-single-node"
  #    HERMES_BASE_URL: "http://127.0.0.1:8642"
