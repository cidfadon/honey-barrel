  # ---------- 5. Investment Analyst API (ML stock predictions) Its actualy MCP ----------------
  investment-analyst-api:
    build:
      context: ./investment-analyst-api
      dockerfile: Dockerfile

    mem_limit: "2g"
    memswap_limit: "2g"
    cpus: "4.0"

    container_name: "investment-analyst-api"
    restart: unless-stopped

    environment:
      <<: *common-env
      API_HOST: "0.0.0.0"
      API_PORT: "8001"
      DEBUG: "false"
      LOOKBACK_DAYS: "${LOOKBACK_DAYS:-90}"
      MODEL_ALGORITHM: "${MODEL_ALGORITHM:-xgboost}"
      TRAIN_TEST_SPLIT: "${TRAIN_TEST_SPLIT:-0.8}"
      MIN_DATA_POINTS: "${MIN_DATA_POINTS:-30}"
      TECH_SMA_MID_WINDOW: "${TECH_SMA_MID_WINDOW:-20}"
      TECH_SMA_LONG_WINDOW: "${TECH_SMA_LONG_WINDOW:-50}"
      TECH_RSI_PERIOD: "${TECH_RSI_PERIOD:-14}"
      TECH_MACD_FAST: "${TECH_MACD_FAST:-12}"
      TECH_MACD_SLOW: "${TECH_MACD_SLOW:-26}"
      TECH_MACD_SIGNAL: "${TECH_MACD_SIGNAL:-9}"
      TECH_BB_STD_MULTIPLIER: "${TECH_BB_STD_MULTIPLIER:-2.0}"
      LABEL_PREDICTION_DAYS: "${LABEL_PREDICTION_DAYS:-1}"
      LABEL_BUY_THRESHOLD: "${LABEL_BUY_THRESHOLD:-0.02}"
      LABEL_SELL_THRESHOLD: "${LABEL_SELL_THRESHOLD:--0.02}"
      FEATURE_INCLUDE_PE_RATIO: "${FEATURE_INCLUDE_PE_RATIO:-true}"
      FEATURE_INCLUDE_DIVIDEND_YIELD: "${FEATURE_INCLUDE_DIVIDEND_YIELD:-true}"
      DEMO_MODE: "false"
      UI_VERSION: "${UI_VERSION:-v0.1.2 (BETA)}"
      YAHOO_CACHE_HOURS: "24"
      STACK_ENV_FILE: "/workspace/.env"
      DOCKER_SOCKET_PATH: "/var/run/docker.sock"
      ALPACA_MCP_CONTAINER_NAME: "alpaca-mcp"
      OLLAMA_BASE_IP: "${OLLAMA_BASE_IP}"
      OLLAMA_BASE_URL: "http://${OLLAMA_BASE_IP}:11434"

    volumes:
      - ./investment-analyst-data/cache:/data/cache
      - ./investment-analyst-data/models:/data/models
      - ./.env:/workspace/.env
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/me/git-repo/honey-barrel-finale/workspace:/workspace

    networks:
      - backend-net
      - frontend-net          # so openclaw can reach it

    ports:
      # Bound to loopback only — for direct API access and debugging.
      - "127.0.0.1:18001:8001"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- 6. OpenClaw (coollabsio fully-dockerised fork) -----------------
