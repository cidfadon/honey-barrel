  # ---------- 2. Workspace (shared volume for development and debugging) ----------
  workspace:
    image: alpine:3.20

    container_name: workspace
    restart: unless-stopped

    working_dir: /workspace

    command: tail -f /dev/null

    volumes:
      - /home/me/git-repo/honey-barrel-finale/workspace:/workspace

    environment:
      MCP_WORKSPACE: /workspace
      WORKSPACE_DIR: /workspace

    networks:
      - backend-net
    
    healthcheck:
      test: ["CMD-SHELL", "test -d /workspace && test -r /workspace || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

