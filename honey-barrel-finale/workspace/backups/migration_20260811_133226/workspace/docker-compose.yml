  #
  #  command: >
  #    sh -c "npm install express node-fetch &&
  #           MCP_URL=http://mcp-toolbox:3001 node mcp-compliance-validator.js"
  #
  #  environment:
  #    MCP_URL: http://mcp-toolbox:3001
  #
  #  depends_on:
  #    - mcp-toolbox
  #
  #  networks:
  #  - backend-net
  #  - mcp-net

  # ---------- 12. MCP workspace (agent-ready workspace filesystem layer) --------------------
  workspace-mcp:
    build:
      context: ./workspace-mcp
      dockerfile: Dockerfile

    privileged: true
    container_name: workspace-mcp
    restart: unless-stopped

    stdin_open: true
    tty: true

    volumes:
      - /home/me/git-repo/honey-barrel-finale/workspace:/workspace

    environment:
      <<: *common-env
      MCP_WORKSPACE: /workspace
      WORKSPACE_DIR: /workspace
      LOG_LEVEL: "debug"

    ports:
        - 3002:3001

    networks:
      - backend-net
      - mcp-net

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- 13. MCP Alpaca (Trading + Market Data v2 — US equities) --------
  alpaca-mcp:
    build:
      context: ./alpaca-mcp
      dockerfile: Dockerfile

    mem_limit: "2g"
    memswap_limit: "2g"
    cpus: "4.0"

    container_name: alpaca-mcp
    restart: unless-stopped

    environment:
      <<: *common-env
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY}
      ALPACA_MODE: ${ALPACA_MODE:-paper}
      MAX_ORDERS_PER_DAY: ${MAX_ORDERS_PER_DAY:-5}
      MAX_NOTIONAL_USD: ${MAX_NOTIONAL_USD:-50}
      BASE_NOTIONAL_PER_TRADE_USD: ${BASE_NOTIONAL_PER_TRADE_USD:-25}
      BUY_CONFIDENCE_THRESHOLD: ${BUY_CONFIDENCE_THRESHOLD:-0.60}
      SELL_CONFIDENCE_THRESHOLD: ${SELL_CONFIDENCE_THRESHOLD:-0.60}
      MAX_NOTIONAL_PER_SYMBOL_USD: ${MAX_NOTIONAL_PER_SYMBOL_USD:-100}
      MIN_TRADE_QTY: ${MIN_TRADE_QTY:-0.01}
      QTY_STEP: ${QTY_STEP:-0.01}
      AUTO_EXECUTE: ${AUTO_EXECUTE:-false}
      LOG_LEVEL: DEBUG

    ports:
        - 3003:3001

    networks:
      - backend-net
      - mcp-net

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

