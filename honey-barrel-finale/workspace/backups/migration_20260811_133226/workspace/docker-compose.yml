  #
  #  environment:
  #    <<: *common-env
  #    WORKSPACE_ROOT: /workspace
  #
  #  networks:
  #    - backend-net
  #    - mcp-net

  # ------------ 10. MCP Terminal (shell execution via HTTP MCP) -----------------------------------
  stdio-terminal:
    build:
      context: ./stdio-terminal
      dockerfile: Dockerfile

    container_name: stdio-terminal
    restart: unless-stopped

    environment:
      <<: *common-env
      MCP_WORKSPACE: /workspace
      WORKSPACE_DIR: /workspace
      PORT: "3002"
      DOCKER_HOST: "unix:///var/run/docker.sock"

    volumes:
      - /home/me/git-repo/honey-barrel-finale/workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - backend-net
      - mcp-net

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    # ---------- 11. (Optional) MCP Compliance Validator (example MCP server for validating tool calls against a JSON schema) --------------------
  #mcp-validator:
  #  build:
  #    context: ./mcp-validator
  #    dockerfile: Dockerfile
  #
  #  container_name: mcp-validator
