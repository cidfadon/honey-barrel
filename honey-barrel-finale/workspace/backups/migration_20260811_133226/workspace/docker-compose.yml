  #    interval: 15s
  #    timeout: 5s
  #    retries: 5
  #    start_period: 30s

  # ---------- 7. Hermes -------------------------------------------------------
  hermes:
    build:
      context: ./hermes
      dockerfile: Dockerfile

    mem_limit: "6g"
    memswap_limit: "6g"
    cpus: "6.0"

    pids_limit: "0"
    ulimits:
      nproc: "8192"
      nofile:
        soft: "65535"
        hard: "65535"

    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

    privileged: true
    container_name: "hermes"
    restart: "unless-stopped"

    tty: true
    stdin_open: true

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - hermes_data:/opt/data
      - hermes_opt:/opt/hermes
      - /home/me/git-repo/honey-barrel-finale/workspace/hermes/skills:/opt/data/skills
      - /home/me/git-repo/honey-barrel-finale/workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      <<: *common-env
      PYTHONPATH: "/opt/hermes/.venv/bin/"
      PATH: "/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      #VIRTUAL_ENV: "/opt/hermes/.venv"
      EDITOR: "vim"
      GOMAXPROCS: "4"
      GOGC: "75"
      GOMEMLIMIT: "2GiB"
      S6_LOGGING: "1"
      S6_KEEP_ENV: "1"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      # Persist Hermes' entire home directory (config.yaml, credentials,
      # sessions, memories, hooks, logs) onto the `hermes_data` named volume
      # mounted at /opt/data below. Without this, `hermes mcp add ...` writes
      # to /root/config.yaml which is wiped on every container recreate.
      HOME: "/opt/data"
      HERMES_HOME: "/opt/data"
      HERMES_SKILLS_DIR: "/opt/data/skills"
      SKILLS_ENABLED: "true"
      MAX_MESSAGES: "50"
      MAX_TOKENS: "8192"
      MAX_RETRIES: "3"
      MAX_CONTEXT_TOKENS: "65536"
      TOOL_RESULT_MAX_LENGTH: "20000"
      HERMES_TOOL_CONCURRENCY: "3"
      MAX_TOOL_CALLS_PER_STEP: "5"
      MAX_AGENT_STEPS: "60"
      HERMES_MAX_ITERATIONS: "100"
      MAX_CONCURRENT_LLM_REQUESTS: "2"
      ENABLE_TOOL_CALLING: "true"
      ENABLE_PARALLEL_TOOL_CALLS: "true"
      STREAMING: "true"
      VERBOSE: "false"
      AUXILIARY_COMPRESSION: "true"
      REPAIR_MESSAGE_STRUCTURE: "true"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "dev-local-key-change-me"
      API_SERVER_CORS_ORIGINS: "*"
      WORKSPACE_DIR: "/workspace"
      HERMES_WORKSPACE: "/workspace"
      # Force terminal to run locally inside this container (not in a sandbox
      # Docker container). Without this, Hermes spins up a separate container
      # that has no access to /workspace volume or docker socket.
      TERMINAL_ENV: "local"
      TERMINAL_CWD: "/workspace"
      HERMES_GATEWAY_DASHBOARD_INSECURE: "1"
      HERMES_GATEWAY_ALLOW_INSECURE: "1"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_INSECURE: "1"
      HERMES_DISABLE_HALLUCINATED_TOOLS: "true"
      HERMES_SKILLS_EXTERNAL_DIRS: "/opt/hermes/skills, /opt/hermes/optional-skills"
      HERMES_ENVIRONMENT_HINT: "You have 4 MCP servers connected: analyst, alpaca, workspace, \
          terminal. RULES: 1. ALWAYS use MCP tools directly. Never simulate outputs. \
          2. NEVER use python or terminal to emulate MCP functionality. 3. workspace MCP is the \ 
          ONLY persistent state system. STATE: - workspace MCP stores watchlists, reports, cron \
          history, and cached results. - All other MCP servers are stateless. WATCHLIST: - All \ 
          modifications MUST go through analyst MCP: watchlist_add, watchlist_remove, watchlist_get, \
          watchlist_snapshot. EXECUTION: - alpaca MCP is execution-only. - Requires explicit flag: \
          In live mode, Alpaca write calls require X-Confirm: true. OBSERVABILITY: - All MCP calls must be logged into workspace MCP \
          with metadata: tool, payload, result_summary, latency. FAILURE MODE: - If MCP call fails, \
          return error state. Do not hallucinate results. WORKSPACE: - Use workspace MCP as \
          /workspace logical namespace for: state, reports, cron outputs, and skill artifacts."
          
      HERMES_TOOL_TIMEOUT: "120"  # 2-min
      HERMES_MCP_PARALLEL: "true"
      HERMES_MCP_SERVERS: "workspace=http://workspace-mcp:3001/mcp,alpaca=http://alpaca-mcp:3001/mcp,analyst=http://investment-analyst-api:8001/mcp,terminal=http://stdio-terminal:3002/mcp"
      MCP_SERVERS: "workspace=http://workspace-mcp:3001/mcp,alpaca=http://alpaca-mcp:3001/mcp,analyst=http://investment-analyst-api:8001/mcp,terminal=http://stdio-terminal:3002/mcp"
      MCP_TOOLBOX_URL: "http://mcp-toolbox:3001"
      #MCP_GATEWAY_URL: "http://mcp-gateway:3002"
      MCP_ALPACA_URL: "http://alpaca-mcp:3001"
      MCP_ANALYST_URL: "http://investment-analyst-api:8001"
      MCP_WORKSPACE_URL: "http://workspace-mcp:3001"
      MCP_TERMINAL_URL: "http://stdio-terminal:3002"
      MCP_FILESYSTEM_CMD: "npx -y @modelcontextprotocol/server-filesystem /workspace"
      MCP_TERMINAL_CMD: "node /opt/hermes/mcp-terminal-stdio.js"
      HOSTNAME: "hermes-honey-barrel"
      GATEWAY_ALLOW_ALL_USERS: "true"
      TELEGRAM_ALLOWED_USERS: "hermes_mbednarski_bot"
      OLLAMA_BASE_IP: "${OLLAMA_BASE_IP}"
      OLLAMA_BASE_URL: "http://${OLLAMA_BASE_IP}:11434"
      # Pin the model Hermes asks Ollama for. `HERMES_INFERENCE_MODEL` is the
      # documented Hermes runtime override; `OLLAMA_MODEL` is kept for any
      # internal helper that reads the bare ollama-style name. Mirrors the
      # `OPENCLAW_PRIMARY_MODEL` pattern used above.
      HERMES_INFERENCE_MODEL: "ollama/${OLLAMA_MODEL:-gemma4-hermes:latest}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma4-hermes:latest}"
      HERMES_LOG_LEVEL: "ERROR"

    extra_hosts:
      - "${OLLAMA_BASE_IP}:host-gateway"   # for reaching openclaw at host.docker.internal:3030 from hermes

    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard (only reached when HERMES_DASHBOARD=1)
      - "9106:9106"   # Prometheus /metrics sidecar

    depends_on:
      - mcp-toolbox
      - stdio-terminal
      - workspace
      - workspace-mcp
      - alpaca-mcp
      #- mcp-gateway
      #- filesystem-mcp
      #- git-mcp
      #- terminal-mcp

    networks:
      - backend-net
      - mcp-net

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9119/health"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 240s

  # ---------- 8. MCP Toolbox (example custom MCP server) ----------------------
  mcp-toolbox:
      build:
        context: ./mcp-toolbox
        dockerfile: Dockerfile

      container_name: mcp-toolbox
      restart: unless-stopped

      volumes:
        - /home/me/git-repo/honey-barrel-finale/workspace:/workspace

      environment:
        <<: *common-env
        MCP_WORKSPACE: /workspace
        WORKSPACE_DIR: /workspace

      ports:
        - "3006:3001"

      networks:
        - backend-net
        - mcp-net

      depends_on:
        - workspace

      healthcheck:
        test: ["CMD", "curl", "-fsS", "http://mcp-toolbox:3001/health"]
        interval: 10s
        timeout: 10s
        retries: 10

  # ---------- 9. MCP Filesystem (example MCP server for file storage) --------------------
  #filesystem-mcp:
  #  build:
  #    context: ./mcp-services/filesystem
