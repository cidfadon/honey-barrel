x-common-env: &common-env
  TZ: Europe/Warsaw

# -----------------------------------------------------------------------------
# Networks
#   - frontend-net : publicly reachable (only openclaw is published)
#   - backend-net  : internal, isolates ollama / postgres / trading-api and others
#   - mcp-net      : internal, isolates hermes / mcp-toolbox
# -----------------------------------------------------------------------------
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  mcp-net:
    driver: bridge
    # Note: was originally `internal: true` for isolation, but Ollama needs
    # outbound to registry.ollama.ai to pull models. Re-enable only after
    # the model has been pulled if you really need to seal the network.

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  #ollama_models:
  pg_data:
  hermes_data:
    external: true
    name: honey-barrel-stack_hermes_data
  hermes_opt:
    external: true
    name: honey-barrel-stack_hermes_opt
  #skill_data:
  prometheus_data:
    external: true
    name: honey-barrel-stack_prometheus_data
  grafana_data:
    external: true
    name: honey-barrel-stack_grafana_data

# -----------------------------------------------------------------------------
# Services
# -----------------------------------------------------------------------------
services:

