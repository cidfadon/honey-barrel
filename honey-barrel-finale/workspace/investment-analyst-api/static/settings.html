<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings Editor</title>
  <style>
    :root {
      --bg: #070b11;
      --bg2: #0f1720;
      --line: #213042;
      --text: #d8e3ef;
      --muted: #8ea2b6;
      --amber: #ffb000;
      --cyan: #74d4ff;
      --ok: #3bffa5;
      --err: #ff5b70;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(900px 340px at 10% -15%, rgba(17, 66, 94, 0.36), transparent 72%),
        radial-gradient(900px 460px at 88% 115%, rgba(78, 24, 24, 0.3), transparent 72%),
        var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", "Fira Code", monospace;
      padding: 14px;
    }
    .shell {
      max-width: 1280px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(16, 27, 39, 0.86), rgba(11, 19, 29, 0.95));
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }
    .top {
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .title { color: var(--amber); letter-spacing: 0.08em; text-transform: uppercase; font-size: 13px; }
    .subtitle { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      border: 1px solid #35506b;
      background: linear-gradient(180deg, #1a3348, #14283a);
      color: #d9ecff;
      text-decoration: none;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .btn:hover { border-color: #4f7ca3; }
    .btn.ok {
      border-color: #207553;
      background: linear-gradient(180deg, #1a553d, #133a2a);
      color: #d5ffe9;
    }
    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 72vh;
    }
    .left {
      border-right: 1px solid var(--line);
      padding: 12px;
      background: rgba(7, 13, 20, 0.66);
    }
    .list-title { color: var(--muted); text-transform: uppercase; font-size: 11px; margin-bottom: 8px; letter-spacing: 0.08em; }
    .files { display: flex; flex-direction: column; gap: 6px; }
    .file-item {
      width: 100%;
      text-align: left;
      border: 1px solid #293b4e;
      background: rgba(18, 30, 42, 0.9);
      color: var(--text);
      padding: 8px;
      border-radius: 8px;
      font-family: inherit;
      cursor: pointer;
      font-size: 12px;
    }
    .file-item:hover { border-color: var(--amber); }
    .file-item.active { border-color: var(--cyan); box-shadow: 0 0 0 1px rgba(116, 212, 255, 0.3) inset; }
    .file-path { color: var(--muted); font-size: 11px; margin-top: 2px; overflow-wrap: anywhere; }
    .right { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .meta { color: var(--muted); font-size: 12px; min-height: 18px; }
    .editor {
      width: 100%;
      min-height: 62vh;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b131c;
      overflow: hidden;
    }
    #editor {
      width: 100%;
      height: 62vh;
      font-size: 12px;
      line-height: 1.45;
    }
    .status { font-size: 12px; min-height: 18px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .status.muted { color: var(--muted); }
    .diff-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b131c;
      padding: 8px;
      min-height: 120px;
      max-height: 250px;
      overflow: auto;
      white-space: pre;
      color: #c9d9e9;
      font-size: 11px;
      line-height: 1.35;
    }
    .diff-box .add { color: #7fffb7; }
    .diff-box .del { color: #ff9baa; }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      .left { border-right: 0; border-bottom: 1px solid var(--line); }
      #editor { height: 48vh; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div>
        <div class="title">SETTINGS</div>
          <div class="subtitle">Syntax-highlighted editor for selected config files</div>
      </div>
      <div class="actions">
        <a class="btn" href="/ui/" target="_top">BACK TO DASHBOARD</a>
        <button id="reload-list" class="btn" type="button">RELOAD FILES</button>
        <button id="reload-file" class="btn" type="button">RELOAD CURRENT</button>
        <button id="preview-diff" class="btn" type="button">PREVIEW DIFF</button>
        <button id="save-file" class="btn ok" type="button">SAVE</button>
      </div>
    </div>

    <div class="grid">
      <aside class="left">
        <div class="list-title">Editable Files</div>
        <div id="files" class="files"></div>
      </aside>

      <section class="right">
        <div id="current-meta" class="meta">Choose file...</div>
          <div class="editor"><div id="editor"></div></div>
        <pre id="diff-preview" class="diff-box">Diff preview will appear here.</pre>
        <div id="status" class="status muted">Ready.</div>
      </section>
    </div>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.36.2/src-min-noconflict/ace.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.36.2/src-min-noconflict/ext-searchbox.js"></script>
  <script>
    const filesRoot = document.getElementById('files');
    const currentMeta = document.getElementById('current-meta');
    const statusEl = document.getElementById('status');
    const diffPreviewEl = document.getElementById('diff-preview');
    const reloadListBtn = document.getElementById('reload-list');
    const reloadFileBtn = document.getElementById('reload-file');
    const previewDiffBtn = document.getElementById('preview-diff');
    const saveFileBtn = document.getElementById('save-file');

    let files = [];
    let currentKey = '';
    let editor = null;
    const SAVE_CONFIRM_KEYS = new Set(['workspace_env', 'docker_compose']);
    const EDITOR_MODES = {
      workspace_env: 'ace/mode/sh',
      docker_compose: 'ace/mode/yaml',
      analyst_env: 'ace/mode/sh',
      hermes_config: 'ace/mode/yaml',
      brudnopis: 'ace/mode/sh',
    };

    function initEditor() {
      editor = ace.edit('editor');
      editor.setTheme('ace/theme/tomorrow_night_bright');
      editor.session.setMode('ace/mode/text');
      editor.session.setUseSoftTabs(true);
      editor.session.setTabSize(2);
      editor.setShowPrintMargin(false);
      editor.setOptions({
        fontSize: '12px',
        enableBasicAutocompletion: false,
        enableLiveAutocompletion: false,
        showLineNumbers: true,
        showGutter: true,
        wrap: true,
      });
      editor.setValue('', -1);
    }

    function setEditorMode(key) {
      if (!editor) return;
      editor.session.setMode(EDITOR_MODES[key] || 'ace/mode/text');
    }

    function setEditorValue(content) {
      if (!editor) return;
      editor.setValue(String(content || ''), -1);
      editor.clearSelection();
    }

    function getEditorValue() {
      return editor ? editor.getValue() : '';
    }

    function esc(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function setStatus(message, kind = 'muted') {
      statusEl.className = `status ${kind}`;
      statusEl.textContent = message;
    }

    function renderDiffPlainText(text) {
      const lines = String(text || '').split('\n');
      diffPreviewEl.innerHTML = lines.map((line) => {
        const safe = esc(line || ' ');
        if (line.startsWith('+') && !line.startsWith('+++')) return `<span class="add">${safe}</span>`;
        if (line.startsWith('-') && !line.startsWith('---')) return `<span class="del">${safe}</span>`;
        return safe;
      }).join('\n');
    }

    function renderFileList() {
      if (!Array.isArray(files) || files.length === 0) {
        filesRoot.innerHTML = '<div class="meta">No files available.</div>';
        return;
      }

      filesRoot.innerHTML = files.map((item) => {
        const active = item.key === currentKey ? 'active' : '';
        const exists = item.exists === false ? ' (missing)' : '';
        return `
          <button class="file-item ${active}" type="button" data-key="${esc(item.key)}">
            <div>${esc(item.label)}${exists}</div>
            <div class="file-path">${esc(item.path)}</div>
          </button>
        `;
      }).join('');
    }

    async function loadFiles() {
      setStatus('Loading files list...', 'muted');
      try {
        const response = await fetch('/api/settings/files', { cache: 'no-store' });
        const payload = await response.json();
        if (!response.ok || !payload.success) {
          throw new Error(payload.detail || payload.error || 'Load files failed');
        }
        files = Array.isArray(payload.files) ? payload.files : [];
        if (!currentKey && files.length > 0) currentKey = files[0].key;
        renderFileList();
        setStatus(`Loaded ${files.length} editable file(s).`, 'ok');
        if (currentKey) await loadFile(currentKey);
      } catch (error) {
        setStatus(`Error: ${error && error.message ? error.message : String(error)}`, 'err');
      }
    }

    async function loadFile(key) {
      if (!key) return;
      currentKey = key;
      renderFileList();
      setStatus('Loading file content...', 'muted');
      try {
        const response = await fetch(`/api/settings/file?key=${encodeURIComponent(key)}`, { cache: 'no-store' });
        const payload = await response.json();
        if (!response.ok || !payload.success) {
          throw new Error(payload.detail || payload.error || 'Load file failed');
        }
        currentMeta.textContent = `${payload.label}  |  ${payload.path}`;
          setEditorMode(key);
          setEditorValue(payload.content || '');
        renderDiffPlainText('Diff preview will appear here.');
        setStatus('File loaded.', 'ok');
      } catch (error) {
        setStatus(`Error: ${error && error.message ? error.message : String(error)}`, 'err');
      }
    }

    async function previewDiff() {
      if (!currentKey) {
        setStatus('Choose file first.', 'err');
        return { changed: false, diff: 'No file selected.' };
      }
      setStatus('Computing diff...', 'muted');
      try {
        const response = await fetch('/api/settings/file-diff', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: currentKey, content: getEditorValue() }),
        });
        const payload = await response.json();
        if (!response.ok || !payload.success) {
          throw new Error(payload.detail || payload.error || 'Diff failed');
        }
        renderDiffPlainText(payload.diff || 'No changes.');
        setStatus(payload.changed ? 'Diff generated.' : 'No changes to save.', 'ok');
        return { changed: Boolean(payload.changed), diff: String(payload.diff || ''), label: payload.label || currentKey };
      } catch (error) {
        setStatus(`Error: ${error && error.message ? error.message : String(error)}`, 'err');
        return { changed: false, diff: 'Diff failed.' };
      }
    }

    async function saveCurrent() {
      if (!currentKey) {
        setStatus('Choose file first.', 'err');
        return;
      }

      const diffInfo = await previewDiff();
      if (!diffInfo.changed) return;

      if (SAVE_CONFIRM_KEYS.has(currentKey)) {
        const ok = confirm(`Confirm SAVE for protected file: ${diffInfo.label || currentKey}?`);
        if (!ok) {
          setStatus('Save canceled by user.', 'muted');
          return;
        }
      }

      setStatus('Saving file...', 'muted');
      try {
        const response = await fetch('/api/settings/file', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: currentKey, content: getEditorValue() }),
        });
        const payload = await response.json();
        if (!response.ok || !payload.success) {
          throw new Error(payload.detail || payload.error || 'Save failed');
        }
        const backupPath = payload.backup_path ? ` | backup: ${payload.backup_path}` : '';
        setStatus(`Saved: ${payload.label}${backupPath}`, 'ok');
      } catch (error) {
        setStatus(`Error: ${error && error.message ? error.message : String(error)}`, 'err');
      }
    }

    filesRoot.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-key]');
      if (!btn) return;
      const key = btn.getAttribute('data-key');
      if (!key) return;
      loadFile(key);
    });

    reloadListBtn.addEventListener('click', loadFiles);
    reloadFileBtn.addEventListener('click', () => loadFile(currentKey));
    previewDiffBtn.addEventListener('click', previewDiff);
    saveFileBtn.addEventListener('click', saveCurrent);

      initEditor();
    loadFiles();
  </script>
</body>
</html>
